# H1 (D52): Atlas on Fly.io. One machine, one volume, one origin. Setup steps: tools/fly-setup.md.
#
# If you pick another app name, change it in TWO places: `app` below and ATLAS_PUBLIC_ORIGIN in [env]. The server
# refuses to start when they disagree (its own-page check would refuse every visitor).

app = "atlas-dami"
# London: the closest Fly region to Lagos with good links (West Africa's subsea cables land in Europe), and a short hop
# to the US services every run calls (Meta's API, Modal, Baseten, the Base RPC). Johannesburg (jnb) is farther from
# Lagos by network and from those services. Not measured; see tools/fly-setup.md "Region".
primary_region = "lhr"

# The server removes its store lock on SIGINT/SIGTERM before it exits (server/access/store.ts).
kill_signal = "SIGINT"
kill_timeout = 30
# A little swap so a brief spike (an anvil fork plus an outline job) slows down instead of being killed.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[deploy]
  # One machine with a volume: "rolling" stops the old process before the new one starts, so two servers never share
  # the store (canary and bluegreen would start a second machine, and Fly refuses them with volumes anyway).
  strategy = "rolling"
  max_unavailable = 1

[env]
  ATLAS_HOSTED = "1"
  ATLAS_PUBLIC_ORIGIN = "https://atlas-dami.fly.dev"
  ATLAS_REQUIRE_INVITE = "1"
  ATLAS_EXECUTOR = "modal"
  # Fly's proxy puts the app's own address right-most in X-Forwarded-For; the visitor's address is in Fly-Client-IP.
  ATLAS_TRUST_PROXY = "1"
  ATLAS_CLIENT_IP_HEADER = "fly-client-ip"
  ATLAS_VOLUME_DIR = "/data"
  ATLAS_INVITES_DIR = "/data/atlas"
  ATLAS_USAGE_PATH = "/data/usage.jsonl"
  # Refusal records (S7) are written here; /app in the image is read-only to the server's user. Nothing else changes:
  # .atlas.json files stay in memory (ATLAS_PUBLISH_PROOFS is not set), apart from a public link someone
  # asked for: its card, without the file's text, is kept in kept/ for 30 days, within caps.
  ATLAS_PROOFS_DIR = "/data/proofs"
  # R10: the no-code example's own daily sandbox allowance. One play starts 3 sandboxes (~$0.0003), so 3,000 starts
  # is ~1,000 plays (~$0.30 a day) and outlasts the 200-plays-an-hour cap for five hours. It never touches the
  # owner's or developers' caps.
  ATLAS_EXAMPLE_SANDBOX_STARTS_PER_DAY = "3000"
  ATLAS_EXAMPLE_SANDBOX_SECONDS_PER_DAY = "18000"
  # R12 (D73): model calls an hour. Each invite code gets a quarter of this (100 an hour: a file with a bet makes about 5, so about 20 files), all codes
  # together and the owner get the whole 400. The 60 default left a code 15 calls (about 3 files) an hour. Money stays
  # capped by the per-code daily ledger and ATLAS_SPEND_CEILING_USD, not by this.
  ATLAS_MODEL_CALLS_PER_HOUR = "400"
  # R12 review (D73): per client address an hour. A judging panel may share one office address, so 20 model rounds and
  # 60 pastes (the defaults) would stop them first, at about 10 to 20 files. The $ ledger still caps money.
  ATLAS_MODEL_ROUNDS_PER_IP_PER_HOUR = "60"
  ATLAS_PASTES_PER_IP_PER_HOUR = "150"
  # R15: sandboxes at once. A run waits for a slot in FIVE places (R16 added the codes' line), and the smallest one decides, so they are set together:
  # - per client address (default 2): phone carriers put many people behind one address, and two phones on one
  #   address got "one client address runs at most 2 sandbox run(s) at once" on the no-code example. Now 4.
  ATLAS_SANDBOX_IP_MAX_CONCURRENT = "4"
  # - the whole server (default 4). Sandboxes run on Modal, not on this machine, and one play holds a slot for about
  #   9 s, so 4 meant roughly 25 plays a minute for everyone together. Now 12.
  ATLAS_SANDBOX_MAX_CONCURRENT = "12"
  # - all no-code visitors of the example together (default 2: the third player anywhere was refused). Now 8. Money
  #   stays bounded by the example's own daily allowance above (3,000 starts, 18,000 sandbox-seconds).
  ATLAS_EXAMPLE_MAX_CONCURRENT = "8"
  # - all invite codes together (R16, review M6; default 3): before R16 this was fixed at 3, so the "other 4 of the 12"
  #   this comment used to promise could never be used by codes. Now 6, so several judges on one code have room. One
  #   code still holds at most 2 sandboxes at once (fixed in server/access/ledger.ts), and its "at once" limit for model
  #   calls and sandboxes together is set per code (atlas-invites create --max-concurrent; the judge code uses 20).
  #   The example's 8 and the codes' 6 add to 14, more than the server's 12: at full load the server-wide 12 decides,
  #   and the run that finds no slot is refused with "the server runs at most 12 sandbox run(s) at once".
  ATLAS_DEV_SANDBOXES_AT_ONCE = "6"
  # - Modal's own runner (default 4 at once, 16 more wait in a queue). Waiting time is booked as sandbox-seconds, so it
  #   matches the server-wide 12: a run the server lets start also starts on Modal at once.
  ATLAS_MODAL_MAX_SANDBOXES = "12"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Never stopped for being idle: the server keeps sessions, live logs and kept runs in memory, warms Modal once at
  # start (D32) and reads the Moonwell PR once at start; a stop would lose all of that and make the next visitor wait.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[mounts]]
  source = "atlas_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[[restart]]
  policy = "on-failure"
  retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
